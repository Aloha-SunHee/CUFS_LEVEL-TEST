# 원어민 녹음 파일 자동 변환
# audio/lt1 ~ audio/lt8 폴더에 m4a·wav 등으로 녹음 파일을 올리면, 같은 이름의 mp3로 바꿔 덮어씁니다.
#  - 예: audio/lt1/L21.m4a → audio/lt1/L21.mp3 (기존 AI 음성 L21.mp3를 대체), 원본 m4a는 지웁니다.
#  - 소리 크기를 일정하게 맞추고(라우드니스 정규화), 앞뒤의 긴 무음을 0.3초 정도만 남기고 자릅니다.
#  - 파일명이 소문자(l21.m4a)거나 확장자가 대문자(.MP3)여도 L21.mp3로 맞춥니다.
#  - mp3로 올린 파일은 이름만 맞추고 그대로 둡니다(기존 AI 음성과 구별할 수 없기 때문).
name: 녹음 파일 mp3 변환

on:
  push:
    branches: [main]
    paths: ['audio/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ffmpeg 설치
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: 변환
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob nocaseglob
          changed=0
          for dir in audio/lt*/; do
            for f in "$dir"*; do
              [ -f "$f" ] || continue
              base="$(basename "$f")"; name="${base%.*}"; ext="${base##*.}"; ext_l="$(echo "$ext" | tr 'A-Z' 'a-z')"
              # 파일명 맞추기: l21 / L 21 / L21_최종 → L21
              num="$(echo "$name" | sed -E 's/^[lL][[:space:]_-]*([0-9]+).*$/\1/')"
              if ! [[ "$num" =~ ^[0-9]+$ ]]; then echo "⚠️ 이름 규칙에 맞지 않아 건너뜀: $f"; continue; fi
              out="${dir}L${num}.mp3"
              if [ "$ext_l" = "mp3" ]; then
                if [ "$f" != "$out" ]; then git mv -f "$f" "$out"; echo "이름 변경: $f → $out"; changed=1; fi
                continue
              fi
              case "$ext_l" in m4a|wav|aac|ogg|oga|opus|webm|flac|mp4|mov|3gp|amr|wma|aiff|aif|caf) ;; *) continue ;; esac
              echo "변환: $f → $out"
              ffmpeg -nostdin -loglevel error -y -i "$f" \
                -af "silenceremove=start_periods=1:start_silence=0.3:start_threshold=-50dB,areverse,silenceremove=start_periods=1:start_silence=0.3:start_threshold=-50dB,areverse,loudnorm=I=-18:TP=-1.5:LRA=11" \
                -ac 1 -ar 44100 -b:a 96k "$out.tmp.mp3"
              mv "$out.tmp.mp3" "$out"
              git rm -q "$f"; git add "$out"; changed=1
            done
          done
          if [ "$changed" = 1 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git commit -m "녹음 파일 mp3 변환"
            git push
          else
            echo "변환할 파일 없음"
          fi
